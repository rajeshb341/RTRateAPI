# Local Environment Configuration
# Overrides default.properties for local development

baseUrl=http://localhost:8080

# RT API endpoint used by com.automation.rt.RtApiRunner - change the URL here
# (overridable at launch with -DrtEndpoint=... or the RT_ENDPOINT environment variable; previous: https://apigw.uat.solartis.net/rtconnectorplratekb/V3)
