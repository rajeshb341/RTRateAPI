# UI input mapping: which value of the API request each UI field gets, so the UI is filled with the same data as the API.
#
#   <UI field> = <JsonPath in the API request body>        (UI field = a name the UI pages read, as the TestData UI: headers)
#   value.<UI field>.<API value> = <UI value>               (optional: the UI wording of an API value)
#
#   default.<UI field> = <value>                            (a required UI-only field neither the API nor a UI: column gives)
#
# The UI data of an iteration comes from its own TestData row: the values mapped below from its API request (they always
# win - the UI gets the same data as the API) + its UI:<field> columns for the UI-only fields (office, agency, carrier,
# location questions ...) + default.<field> for what neither gives. Keys with spaces need "\ " (e.g. Short-Term\ Rental).
# (UI field names: sheet TestData "UI:" headers / the pages in com.automation.ui.pages.)
# Add / change fields here as more UI elements are handled.

# --- Location / address -------------------------------------------------------------------------------------------
Insured_Address=$.Account.Insured[0].Location[0].LocationFullAddress

# --- Policy -------------------------------------------------------------------------------------------------------
PolicyEffectiveDate=$.PolicyEffectiveDate
Policy_Form=$.SublineName
coverage_A=$.Account.Insured[0].Location[0].Building[0].Coverage[0].DwellingCoverage.Limit
LossSettlement_Type=$.Account.Insured[0].Location[0].Building[0].Coverage[0].DwellingValuation

# Product (Insured Details "Product") from the subline
product=$.SublineName
value.product.HO3=Homeowners
value.product.HO5=Homeowners
value.product.HO8=Homeowners
value.product.HO6=Condo
value.product.DP1=Dwelling Fire
value.product.DP3=Dwelling Fire

# --- Risk Details (Location 1) - com.automation.ui.pages.RiskDetailsPage --------------------------------------------
# UI values are the dropdown data-values recorded from the UI (UiExplorer, 17 Nov 2026)

# Year Built (input DateBuilt)
Year_Built=$.Account.Insured[0].Location[0].Building[0].DateBuilt

# # of Stories (div#NumberOfStories: 1, 1.5, 2, 2.5, 3, 4, 5+)
noOfStories=$.Account.Insured[0].Location[0].Building[0].NumberOfStories
value.noOfStories.5=5+
value.noOfStories.6=5+
value.noOfStories.7=5+
value.noOfStories.8=5+
value.noOfStories.9=5+
value.noOfStories.10=5+
value.noOfStories.15=5+
value.noOfStories.11=5+
value.noOfStories.12=5+
value.noOfStories.13=5+
value.noOfStories.14=5+
value.noOfStories.16=5+
value.noOfStories.17=5+
value.noOfStories.18=5+
value.noOfStories.19=5+
value.noOfStories.20=5+
value.noOfStories.21=5+
value.noOfStories.22=5+
value.noOfStories.23=5+
value.noOfStories.24=5+
value.noOfStories.25=5+
value.noOfStories.26=5+
value.noOfStories.27=5+
value.noOfStories.28=5+
value.noOfStories.29=5+
value.noOfStories.30=5+

# Protection Class (div#ProtectionClass: 1 - 10)
protectClass=$.Account.Insured[0].Location[0].Building[0].ProtectionClass

# Construction (div#ConstructionType) - Masonry / Reinforced Concrete / Steel / Superior: closest UI choice (to confirm)
constType=$.Account.Insured[0].Location[0].Building[0].ConstructionType
value.constType.Masonry=BrickStoneorMasonry
value.constType.Reinforced\ Concrete=Steelframewithconcreteroofdeck
value.constType.Steel=SteelFireResistive
value.constType.Superior=SteelFireResistive
value.constType.Adobe=Other
value.constType.Log\ Home=Log

# Occupancy (div#Occupancy: OwnerPrimary, OwnerSeasonal, TenantLongTerm, TenantShortTerm, Vacant)
Occupancy_Type=$.Account.Insured[0].Location[0].Building[0].Occupancy
value.Occupancy_Type.Primary=OwnerPrimary
value.Occupancy_Type.Secondary/Seasonal=OwnerSeasonal
value.Occupancy_Type.Long-Term\ Rental=TenantLongTerm
value.Occupancy_Type.Short-Term\ Rental=TenantShortTerm
value.Occupancy_Type.Owner\ -\ Primary\ Residence=OwnerPrimary
value.Occupancy_Type.Owner\ -\ Secondary\ Residence=OwnerSeasonal
value.Occupancy_Type.Rental\ -\ Annual=TenantLongTerm
value.Occupancy_Type.Rental\ -\ Short\ Term/Seasonal=TenantShortTerm
# no Builders Risk choice in the UI (to confirm)
value.Occupancy_Type.Builders\ Risk=Vacant

# Type of Residence (div#ResType) from the Number Of Families
residenceType=$.Account.Insured[0].Location[0].Building[0].NumberOfFamilies
value.residenceType.1=SingleFamilyDwelling
value.residenceType.2=Duplex
value.residenceType.3=Triplex
value.residenceType.4=Fourplex

# Age of Roof band -> Roof Updated Year (input YearofRoof) = effective year - 3 / 8 / 15 (RiskDetailsPage)
AgeOfRoof=$.Account.Insured[0].Location[0].Building[0].AgeOfRoof

# --- Coverage Details - com.automation.ui.pages.CoverageDetailsPage (recorded on rtconnectorpldev) ----------------
# Form Type (div#SublineName: HO3, HO5, HO6, HO8) = Policy_Form above

# Include Wind? (radio IncludeWind Yes / No)
includeWind=$.Account.Insured[0].Location[0].Building[0].Coverage[0].PLWindCoverage.CoverageSelected

# Dwelling / Personal Property Valuation (div#DwellingValuation, div#PersonalPropertyValuation: RCV, ACV, FRCV)
# from the test data (the request sends the Rater's "ALL" for HO6 / DP Vacant / Builders Risk)
dwellingValuation=row.12
value.dwellingValuation.FRC=FRCV
ppValuation=row.13
value.ppValuation.FRC=FRCV

# Cov A (input DwellingCoverage.Limit), Cov B (input OtherStructureCoverage.Limit, required since 23 Nov 2026),
# Cov D (input LossOfUseCoverage.Limit): typed as is
coverage_B=$.Account.Insured[0].Location[0].Building[0].Coverage[0].OtherStructureCoverage.Limit
coverage_D=$.Account.Insured[0].Location[0].Building[0].Coverage[0].LossOfUseCoverage.Limit
# Cov C (div#PersonalPropertyCoverage_dt_Limit: 10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, Other).
# Other amounts (e.g. 149500) have no option - "Other" opens no input: reported as not set
coverage_C=$.Account.Insured[0].Location[0].Building[0].Coverage[0].PersonalPropertyCoverage.Limit

# Cov E Liability (div#PersonalLiabilityCoverageL_dt_Limit: 25000 ... 1000000); the API's None has no option
liabilityLimit=$.Account.Insured[0].Location[0].Building[0].Coverage[0].PersonalLiabilityCoverageL.Limit
# Cov F Medical Payments (div#MedicalPaymentsCoverageM_dt_Limit: data-values 500, 1000, 5000, 10000); 2000 / 3000 / 4000 have no option
medPayLimit=$.Account.Insured[0].Location[0].Building[0].Coverage[0].MedicalPaymentsCoverageM.Limit

# All-Peril Deductible (div#DwellingCoverage_dt_AopPolicyDeductibleAmount: 500, 1000, 2500, 5000, 10000, 25000, Other)
aopDeductible=$.Account.Insured[0].Location[0].Building[0].Coverage[0].AOPDeductible.Limit

# Wind / Hail Deductible (div#DwellingCoverage_dt_WindDeductibleType: Excluded, 500 ... 5000, 1, 2, 3, 5, 10 = %)
windDeductible=$.Account.Insured[0].Location[0].Building[0].Coverage[0].WindDeductiblePercentage
value.windDeductible.0.01=1
value.windDeductible.0.02=2
value.windDeductible.0.03=3
value.windDeductible.0.05=5
value.windDeductible.0.1=10

# Replacement Cost on Contents (div#ReplacementCostonContents: Yes / No)
replacementCostOnContents=$.Account.Insured[0].Location[0].Building[0].Coverage[0].ReplacementCostOnContentsCoverage.CoverageSelected

# Optional Coverages (collapsed section; Included / Not Included)
limitedMold=$.Account.Insured[0].Location[0].Building[0].Coverage[0].LimitedMoldCoverage.Limit
value.limitedMold.*=Included
waterBackup=$.Account.Insured[0].Location[0].Building[0].Coverage[0].WaterBackupCoverage.Limit
value.waterBackup.*=Included
identityFraud=$.Account.Insured[0].Location[0].Building[0].Coverage[0].IdentityFraudCoverage.CoverageSelected
value.identityFraud.Yes=Included
value.identityFraud.No=Not\ Included
extendedReplacementCost=$.Account.Insured[0].Location[0].Building[0].ExtendedReplacementCost
value.extendedReplacementCost.Yes=Included
value.extendedReplacementCost.No=Not\ Included

# The UI must hold the same values as the API request: every filled field is read back before the page is saved and the
# case fails when one differs (iterations/<id>/ui-input-check.txt lists each field: expected, shown, OK / DIFF).
# A value a UI dropdown does not offer (AOP 1500, Med Pay 2000 / 3000 / 4000, Liability None, rental occupancies ...) fails
# the case. Only with -Dui.fallback.nearestOption=true the nearest UI option is used instead (ui-substitutions.txt).

# --- UI-only fields required by the page that neither the API nor a UI: column gives ------------------------------------
# Risk Details: Roof Value * (input RoofValue), Fire Station * (input FireStation)
default.RoofValue=15000
default.fireStationName=Station 1
# Risk Details: "Is aluminum wiring pigtailed? *" (div#IsAluminumWiringPigTailed) - shown when Wiring Type is Aluminium
default.aluminumWiringPigtailed=Yes
# Coverage Details: Cov B / Cov C deductibles and Liability Type are required, UI-only
default.covBDeductible=1000
default.covCDeductible=1000
default.liabilityType=Per Occurrence
# Carrier Selection - Quote Information (Effective Date = PolicyEffectiveDate above; Billing Type = UI:Billing_Type)
default.termMonths=12 Months
default.brokerageMarketsOnly=No
# Coverage Details: Replacement Cost on Contents is required; the request has no value for HO3 / HO5 / HO8
default.replacementCostOnContents=No
