# Rater INPUT row -> JSON path in the request body.
# The body starts from the test case's configuration template (config/templates/<CONFIGURATION>.json, see rater.properties);
# without configurations it starts from APIRequest.txt.
# A row with no path is still written to the Rater but is NOT sent in the request (it is logged as a warning).
#
#   row.N=<path>              the row's value (after rater-value-mapping.txt / range resolution) goes to <path>
#   row.N.<name>=<path>       an extra request attribute fed by the same row; its value mapping target is "N.<name>"
#   <CONFIG>.row.N[.<name>]=  replaces the entry above for one configuration (e.g. HO6.row.60); blank = not sent there
#
# Paths were checked against the RequestResponse samples and the UAT API (an unknown attribute or value -> HTTP 500).

# Building = Account.Insured[0].Location[0].Building[0]      Coverage = Building.Coverage[0]
# Row 7 (Rater label "State Code", attribute CarrierName) is a formula: LEFT(RatingTerritory,2). It is not test data; its
# recalculated value is the request's StateRegionCode (rater.request.derivedRows=7). The template's code would otherwise
# be sent for every state, and the API rates by it.
row.7=Account.Insured[0].Location[0].StateRegionCode
# Row 9 (the Rater calls it Company; dropdown DP1,DP3,HO3,HO5,HO8,HO6) is the policy form = the request's top-level SublineName
row.9=SublineName
row.12=Account.Insured[0].Location[0].Building[0].Coverage[0].DwellingValuation
row.13=Account.Insured[0].Location[0].Building[0].Coverage[0].PersonalPropertyValuation
row.14=TransactionType
row.15=Account.Insured[0].Location[0].State
row.16=Account.Insured[0].Location[0].County
row.17=Account.Insured[0].Location[0].Zipcode1
row.18=Account.Insured[0].Location[0].Building[0].Coverage[0].DwellingCoverage.Limit
row.19=Account.Insured[0].Location[0].Building[0].Coverage[0].OtherStructureCoverage.Limit
row.20=Account.Insured[0].Location[0].Building[0].Coverage[0].PersonalPropertyCoverage.Limit
row.21=Account.Insured[0].Location[0].Building[0].Coverage[0].LossOfUseCoverage.Limit
row.22=Account.Insured[0].Location[0].Building[0].CoastalWaterDistance
row.23=Account.Insured[0].Location[0].Building[0].DateBuilt
