wind.RoofUpdated=Account.Insured[0].Location[0].Building[0].RoofUpdated
wind.SquareFt=Account.Insured[0].Location[0].Building[0].SquareFt
wind.TigerCQApplicable=Account.Insured[0].Location[0].Building[0].Coverage[0].TigerCQApplicable
