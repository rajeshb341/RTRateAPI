row.38=Account.Insured[0].Location[0].Building[0].Coverage[0].WaterDamageDeductible.Limit
# Row 40 is a score band ("614-652") or a status ("No Hit", "Reject", "Not Needed"): the score goes to InsuranceScoreRange
# (one number inside the band, rater.range.rows) and the status code to InsuranceScoreStatus (value mapping target 40.status)
row.40=Account.Insured[0].InsuranceScoreRange
row.40.status=Account.Insured[0].InsuranceScoreStatus
row.41=Account.Insured[0].InsuranceScoreFetchedDate
row.43=Account.Insured[0].Location[0].Building[0].Coverage[0].PLWindCoverage.CoverageSelected
row.44=Account.Insured[0].Location[0].Building[0].Coverage[0].RMSModeledPremium
