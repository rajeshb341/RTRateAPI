# Coverages a configuration's API does not accept are not sent (its template has no node for them; a value -> HTTP 500).
# Where the Rater still rates them, the premium difference shows in the report instead of failing the whole request.
# HO6: no Limited Mold, Theft or Identity Fraud limit (the Rater has no HO6 rate for them either)
HO6.row.50=
HO6.row.77=
HO6.row.52.limit=
# DP1: no Vandalism & Malicious Mischief (any value -> HTTP 500; DP3 and the DP1 Builders Risk / Vacant combinations accept it)
DP1.row.78=
# Builders Risk / Vacant: no Water Back-Up (the Rater rates it with the DP1/DP3 tables) and no Identity Fraud limit
# (CoverageSelected alone is accepted).
# Medical Payments IS sent: not applicable here (test data "None"), so MedicalPaymentsCoverageM.Limit goes as "".
# Liability IS sent: the API accepts the limit (the Rater rates it with the monthly Builders Risk / Vacant table).
DP1_BUILDERS_RISK.row.51=
DP1_BUILDERS_RISK.row.52.limit=
DP3_BUILDERS_RISK.row.51=
DP3_BUILDERS_RISK.row.52.limit=
DP1_VACANT.row.51=
DP1_VACANT.row.52.limit=
DP3_VACANT.row.51=
DP3_VACANT.row.52.limit=

# --- Wind attributes: sent only when PLWindCoverage (row 43, rater.wind.row) = Yes ---------------------------------------
# Taken from the wind samples ("Test case with WindCoverage": HO3, DP3 and DP3 Builders Risk request/response).
#   wind.<Name>=<path>          the value of the test data column "Request:<Name>" (a blank cell is sent as "")
#   wind.default.<Name>=<value> sent when the test data has no "Request:<Name>" column
# An attribute with neither a column nor a default is not sent. Without wind the request is unchanged.
# With a wind template (configuration.<ID>.windTemplate) only attributes that the template has are set; the template's
# own values stay for the rest (e.g. Latitude / Longitude / LocationFullAddress of the sample).
wind.ExteriorSiding=Account.Insured[0].Location[0].Building[0].ExteriorSiding
wind.RoofType=Account.Insured[0].Location[0].Building[0].RoofType
wind.RoofShape=Account.Insured[0].Location[0].Building[0].RoofShape
wind.RoofSlope=Account.Insured[0].Location[0].Building[0].RoofSlope
wind.RoofBrace=Account.Insured[0].Location[0].Building[0].RoofBrace
wind.RoofParapetsAvailable=Account.Insured[0].Location[0].Building[0].RoofParapetsAvailable
wind.Fasteners=Account.Insured[0].Location[0].Building[0].Fasteners
wind.GuttersPresent=Account.Insured[0].Location[0].Building[0].GuttersPresent
wind.WindRating=Account.Insured[0].Location[0].Building[0].WindRating
wind.SecondaryWaterResistance=Account.Insured[0].Location[0].Building[0].SecondaryWaterResistance
wind.RoofToWallConnection=Account.Insured[0].Location[0].Building[0].RoofToWallConnection
wind.MitigationOpenings=Account.Insured[0].Location[0].Building[0].MitigationOpenings
wind.ProtectionMissilesSize=Account.Insured[0].Location[0].Building[0].ProtectionMissilesSize
# Not in the test data: the samples' values (same in all three samples)
