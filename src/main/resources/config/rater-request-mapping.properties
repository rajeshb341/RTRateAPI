wind.default.RoofUpdated=2006
wind.default.SquareFt=1403
wind.default.TigerCQApplicable=Y

# --- Address (every request) -----------------------------------------------------------------
# A real address inside the case's ZIP, County and State is fetched at run time (rater.geocode.* in rater.properties)
# and sent with these attributes. State and Zipcode1 stay the test data values (rows 15, 17). County is spelled as in
# the Rater's county table for the case's subline (rater.address.countyTable, sheet County); a county that is not in
# the table is replaced by the ZIP's county for the Rater and the request alike. A wind request keeps exactly the keys
# of its wind sample.
address.LocationFullAddress=Account.Insured[0].Location[0].LocationFullAddress
address.County=Account.Insured[0].Location[0].County
address.City=Account.Insured[0].Location[0].City
address.Latitude=Account.Insured[0].Location[0].Latitude
address.Longitude=Account.Insured[0].Location[0].Longitude
