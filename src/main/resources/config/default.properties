# Default Configuration for API Automation Framework
# This file provides fallback values for all environments

# Base URL (will be overridden by environment-specific config)
baseUrl=http://localhost:8080

# Request timeout in milliseconds
timeoutMs=30000

# Number of retry attempts for failed requests
retryCount=3

# Follow HTTP redirects
followRedirects=true

# Default content type for requests
defaultContentType=application/json

# Excel configuration
excelFilePath=src/test/resources/testdata/test-data.xlsx
sheetName=TestCases
startRow=1
endRow=-1

# Report output directory
reportOutputDir=target/allure-results

# Run in headless mode
headless=true

# Logging
log.level=INFO
log.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n