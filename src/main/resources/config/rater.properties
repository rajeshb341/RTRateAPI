rater.configuration.sublineRow=9
rater.configuration.occupancyRow=26
rater.configuration.valuationRows=12,13
rater.configurations=HO3,HO5,HO6,HO8,DP1,DP3,DP1_BUILDERS_RISK,DP3_BUILDERS_RISK,DP1_VACANT,DP3_VACANT
