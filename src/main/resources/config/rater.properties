# Rater validation settings (com.automation.rater.RaterValidationRunner)

# --- Rater workbook -------------------------------------------------------------------------
# The original file is never modified; inputs are written into a temporary copy that is recalculated.
# Relative to the project folder (the run's working directory); an absolute path also works.
# RT Common Lloyds Rater BRD V4.0 11-11-2026 (updated 16 Nov). Compared with the first 11-11-2026 file: Insurance Score
# Factor (C147) and Renewal Insurance Score Factor (C274) take the "Not Applicable" row of the Rate Tables (factor 0) for
# the subline and state code (C7) when Insurance Score Range (row 40) is "Not Applicable"; C274 reads row 40 (was 93);
# Book Of Business adjustment table (Rate Tables JD:JH) covers 38 states (was 25); Wind Deductible (row 45) dropdown =
# Rate Tables JT8:JT13; Sheet1 / Sheet2 removed.
# 11-11-2026 vs 10/30/2026: renewal input rows 89-99 and renewal calculation rows 230-352 added; row 229 = NonWindFDR.
# RT Common Lloyds Rater BRD V4.0 (10/30/2026 Final, ISF fix). Compared with V4.0 Final: Insurance Score Factor (C147)
# first takes the "Not Applicable" row of the Rate Tables for the subline and state code (C7), e.g. MD / MA, before the
# score band; Wind Deductible (row 45) has no dropdown list any more. Rate Tables unchanged.
# V4.0 Final vs V3.0 Updated (10/30/2026): Water Damage Deductible
# (row 38) dropdown adds 500 and 1000; Insurance Score Range (row 40) dropdown adds "Not Applicable" (Insurance Score
# Factor 1, like "Not Needed"); formulas and Rate Tables unchanged; no "County" sheet (see rater.address.countyFile).
# V3.0 Updated (10/30/2026) vs 10/29/2026: HO6 Minimum Earned Premium (C226)
# looks up the full territory (Rate Tables IZ now "CT1", "MA2" ...); HO6 Protection Class 7 / 8 / 9 / 10 = 1.2 / 1.3 / 2 / 2
# (was 1.1 / 1.2 / 1.4 / 1.5); HO6 Central Station Burglar & Fire Alarm 0.9 (was 0.95).
# 10/29/2026 vs 10/28/2026: only C160 Misc Surcharge Amount
# changed, now ROUND(C159*C47,2) (was C159*C47).
# 10/28/2026 vs 10/27/2026: same rows,
# attribute names, ENTITY TYPE, dropdowns, Rate Tables and State TFS. Changes: C106 Rating Territory matches State + County
# + Zip (was State + County only, which took the county's last row) and falls back to the county's ALL row; C107 Renewal
# Coverage Inflation Factor tests the rated subline C104 (was C9), so DP3 Builders Risk / Vacant get 0 again.
# 10/27/2026 vs 08/05/2026: C107 'DP3' (was 'DP_3'); C111 rounded to 4 decimals; C161 rounded to 2 decimals; C164 Minimum
# Property Rate is the rate-table lookup again (was a fixed 0.0583); territory table uses underscore state names
# (North_Carolina, ...); Construction Type (row 25) dropdown adds Adobe and Log Home.
rater.workbook=Worksheet in RT Common Lloyds Rater BRD V4.0 11-11-2026.xlsx
rater.sheet=Rater
rater.valueColumn=C
# Spreadsheet application driven through COM. WPS Office = KET.Application (falls back to Excel.Application).
rater.comProgId=KET.Application
rater.scriptsDir=scripts/rater

# --- Attribute rows (as given; column F holds the attribute name, D/E its parents) ----------
# Inputs are the ENTITY TYPE "Req/Resp" rows the test data drives; outputs are "Resp" rows (a mismatch is logged at run time).
# Req/Resp rows 2-8 and 10 are not test data inputs: 2-6 and 8 are Rater constants that differ from the API's product codes
# (the request keeps the configuration template's values), 7 is a formula (state code) sent via rater.request.derivedRows,
# and 10 holds the company short name. 85/86 are empty in the Rater.
rater.input.rows=9,11-23,25-38,40-41,43-45,47-48,50-60,62-75,77-79,81-82,89-93,95
rater.output.rows=104-108,110-114,116-141,143-153,155-157,159-162,164-166,168-182,213-215,217,219-223,225-229

# Dropdown whose list depends on another input: <row>=<parent row>   (County list depends on State)
rater.dependent=16=15

# Inputs without a dropdown keep the Rater's current value unless values are listed here (separator |).
# rater.input.17.values=32003|33101|75001
# rater.input.18.values=200000|274000|350000
# rater.input.31.values=$250,000 - $349,999|$350,000 - $449,999

# A test case with an empty value for an input that has a Rater dropdown is reported as Skipped ("Invalid test data")
# instead of being run. Inputs listed here may be empty: 89 Book Of Business Adjustment (only Renewal cases have it;
# an empty Renewal value takes rater.input.renewal.89). Wind Deductible (45) must have a value.
rater.input.optionalRows=89
# Test data values that the Rater words differently (rater.input.alias.<row>=value=Rater value;...): the test data keeps
# the Wind Deductible (45) as the API's fraction, the Rater gets its dropdown wording (Rate Tables JT). Wind requests send
# the fraction again in every request (45 in rater-value-mapping.txt; the API answers HTTP 500 for the wording).
rater.input.alias.45=0.01=Greater of $2,500 or 1%;0.02=Greater of $5,000 or 2%;0.04=Greater of $10,000 or 4%;0.05=Greater of $15,000 or 5%;0.1=Greater of $25,000 or 10%
# An input that stands for another row's value takes that value (for the Rater and the request):
# Water Damage Deductible (38) "Equal to AOP" = the AOP Deductible (37) amount, e.g. 5000
rater.input.valueFrom.38=37|Equal to AOP
# Policy dates: today (or MM/dd/yyyy) for the Rater (row 2 Applicable start date, row 3 Effective date, row 4 Expiration
# date = +1 year), the API request (ApplicableDate / EffectiveDate / PolicyEffectiveDate / ExpirationDate /
# PolicyExpirationDate) and the UI (Effective Date) alike - a New Business quote in the UI needs a current date.
# Blank = the Rater's and the request templates' own dates.
rater.dates.effective=today
# Renewal inputs of the Rater (rows 89-99, "RENEWAL - INPUT VALUES"): Insurance Score Factor Last Run Date (92) and
# Insurance Score Range (93) are the case's own (rows 41 and 40); "*" = always
rater.input.valueFrom.92=41|*
rater.input.valueFrom.93=40|*
# Renewal cases (rater.request.renewal.row = Renewal) get these Rater inputs (unless the test data has them); they are
# also sent in the request (rows 89 / 90 / 91 / 95 in rater-request-mapping.properties), as in RenewalRequest.txt
rater.input.renewal.89=No
rater.input.renewal.90=0.5
rater.input.renewal.91=0.7
rater.input.renewal.95=No Adjustment

