# --- UI vs API validation ---------------------------------------------------------------------
# ui.enabled=true: the Rater validation (RaterValidationRunner / testng.xml) runs every iteration as its API call, then at
# once its UI flow with the same test data, then the next iteration (one at a time - rater.api.threads is not used).
# Reports in the same Run_<stamp> folder: RaterValidationReport (API vs Rater) + UiValidationReport (API vs UI).
# false = API vs Rater only. (com.automation.rater.UiApiValidationRunner runs API vs UI alone, without the Rater.)
ui.enabled=true
# Every case goes to the API (Expected = API response) and to the UI flow (Actual = values shown in the UI), with the
# same inputs. The Rater is not used. Output: <ui.report.dir>/Run_<stamp>/ (UiValidationReport_<stamp>.xlsx,
# ui-attributes.txt = the attribute keys, iterations/<id>/ request.json, response.json, ui-outputs.json).
# The UI flow class implements com.automation.ui.UiRatingFlow (public no-argument constructor):
#   com.automation.ui.RtUiRatingFlow       = the RT application UI (login from .env, ConfiguredNew flow, TestData UI: columns)
#   com.automation.ui.ApiEchoUiRatingFlow  = STUB: opens no UI, echoes the API response (checks the plumbing only)
ui.flow.class=com.automation.ui.RtUiRatingFlow
# Test cases: rater.iterations - one iteration id is the API call and its UI flow together (same test data row).
# UI data of an iteration = its own TestData row: the API request values (config/ui-input-mapping.properties) + its
# UI:<field> columns (UI-only fields such as UI:OfficeName, UI:Agency_name, UI:OccupationType)
# The UI's own API calls (browser Network tab, XHR / fetch) are saved per case in iterations/<id>/ui-network/.
# ui.capture.urlPattern = regex of the URLs to save (blank = all XHR / fetch calls).
ui.capture.urlPattern=
# ui.response.urlPattern = regex of the UI's rating API URL: its last response is the Actual (UI) value, read with the
# same paths as the API response. Blank = not known yet: nothing is compared (N/A) - find the call in ui-network/.
ui.response.urlPattern=
# ui.response.event = the UI's rating call, by the EventName in its request body. It must be made once the quote is
# created (else the UI case fails); its last response is the Actual (UI) value. Takes precedence over ui.response.urlPattern.
ui.response.event=GetCoverageLimitsAndRates_WF_1.0.7.0
# ui.flow.stopAt=markets: each UI case ends at Carrier Selection once Get Available Market is clicked (until the
# environment returns markets / quotes); the run folder's UiReachSummary.txt lists how far each case got. Empty = full flow.
ui.flow.stopAt=markets
# true = no browser window (also -Dui.headless=true)
ui.headless=false
# Parallel workers; each has its own API client and UI flow instance (browser)
ui.threads=1
ui.report.dir=target/ui-output