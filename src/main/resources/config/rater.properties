# Rater validation settings (com.automation.rater.RaterValidationRunner)

# --- Rater workbook -------------------------------------------------------------------------
# The original file is never modified; inputs are written into a temporary copy that is recalculated.
# Relative to the project folder (the run's working directory); an absolute path also works.
rater.workbook=LloydsRater.xlsx
rater.sheet=Rater
rater.valueColumn=C
# Spreadsheet application driven through COM. WPS Office = KET.Application (falls back to Excel.Application).
rater.comProgId=KET.Application
rater.scriptsDir=scripts/rater

# --- Attribute rows (as given; column F holds the attribute name, D/E its parents) ----------
rater.input.rows=11-23,25-38,40-41,43-45,47-48,50-60,62-75,77-79,81-82
rater.output.rows=104-108,110-114,116-141,143-153,155-157,159-162,164-166,168-182,217,219-223,225-229

# Dropdown whose list depends on another input: <row>=<parent row>   (County list depends on State)
rater.dependent=16=15

# Inputs without a dropdown keep the Rater's current value unless values are listed here (separator |).
# rater.input.17.values=32003|33101|75001
# rater.input.18.values=200000|274000|350000
# rater.input.31.values=$250,000 - $349,999|$350,000 - $449,999

# --- Test data ------------------------------------------------------------------------------
# The single test data file: edit the cases here. It is only ever READ by a run; --generate never overwrites it.
rater.testdata.file=src/test/resources/testdata/test-data.xlsx
rater.testdata.sheet=TestData
# Which iterations (test cases) to execute. Empty = all test cases in the sheet.
# Numbers match the TestCaseId digits (1 = TC001); ranges and ids also work:  1,2,3   |   1-3,7   |   TC001,TC004
# A -DraterCases=... / --cases argument given at launch overrides this.
rater.iterations=1-5
# Number of test cases created by --generate (case 1 is always the Rater's current values)
rater.testdata.count=10
# Fixed seed => repeatable test data. Leave empty for a different set every time.
rater.testdata.seed=12345

# --- Mappings (attribute row -> JSON path) --------------------------------------------------
rater.requestMapping=config/rater-request-mapping.properties
rater.responseMapping=config/rater-response-mapping.properties

# --- Comparison -----------------------------------------------------------------------------
# Numbers are equal when |expected - actual| <= tolerance. Override per output row with rater.compare.tolerance.<row>
rater.compare.tolerance=0.01
# rater.compare.tolerance.229=0.000001

# --- Output ---------------------------------------------------------------------------------
rater.report.dir=target/rater-output
# true = keep a filled copy of the Rater for every test case in <report.dir>/filled-raters
rater.saveFilledRater=false