# HO6 water damage sub-limits are rated for a few zip codes only (Rate Tables DO); elsewhere a sub-limit -> HTTP 500
configuration.HO6.values.36=Full Policy Limits

# Rows the Rater derives (formulas) whose recalculated value is sent in the request: 7 = state code (LEFT(RatingTerritory,2))
rater.request.derivedRows=7
# StateRegionCode (row 7) is the code of the State (row 15), e.g. Connecticut -> CT; the Rater's own lookup is blank for
# some locations. The Rater's value is kept only when the state name is unknown.
rater.request.stateRow=15
rater.request.stateCodeRow=7
# Subline + state combinations with fixed request values. A rule applies when the case's state code is in
# rater.request.stateRule.<rule>.states.<CONFIG> (a configuration's own list) or else rater.request.stateRule.<rule>.states,
# and sets its values (path=value;...; a path the request body does not have is not added).
rater.request.stateRules=insuranceScoreNA,tigerCQNA
# Insurance score not applicable: every subline (HO3, HO5, HO6, HO8, DP1, DP3, DP1/DP3 Builders Risk, DP1/DP3 Vacant)
# in HI, KY, MA, MD
rater.request.stateRule.insuranceScoreNA.states=HI|KY|MA|MD
rater.request.stateRule.insuranceScoreNA.values=Account.Insured[0].InsuranceScoreStatus=Not Applicable;Account.Insured[0].InsuranceScoreRange=-1
# The Rater gets Insurance Score Range (40) "Not Applicable" in these states (C147 then takes the Rate Tables factor 0)
rater.request.stateRule.insuranceScoreNA.raterInputs=40=Not Applicable
# TigerCQ not applicable: every subline in these states. TigerCQApplicable is only in wind requests, so it changes
# wind requests only.
rater.request.stateRule.tigerCQNA.states=AK|AL|AR|AZ|CA|CO|DC|DE|GA|IA|ID|IL|IN|KS|LA|MA|MD|ME|MI|MN|MO|MS|MT|NC|ND|NE|NH|NJ|NM|NV|NY|OH|OR|PA|SC|SD|TN|TX|UT|VA|VT|WA|WI|WV|WY
rater.request.stateRule.tigerCQNA.values=Account.Insured[0].Location[0].Building[0].Coverage[0].TigerCQApplicable=N
# A wind case of a state where TigerCQ does not apply (the tigerCQNA rule) is rated WITHOUT wind: the Rater gets
# PLWindCoverage No and the request keeps the wind request's shape with PLWindCoverage No and TigerCQApplicable N
# (TigerCQApplicable N with wind Yes -> HTTP 500). Blank = wind cases are rated with wind in every state.
rater.wind.offRule=tigerCQNA

# Renewal requests (Transaction Type, row 14 = Renewal - see RenewalRequest.txt): QuoteType Renewal (path=value;...);
# BookOfBusinessAdjustment, Min / Max RenewalReserveFactor and RenewalAdjustmentType come from the renewal inputs
# (rater.input.renewal.*). New Business requests stay as they are.
rater.request.renewal.row=14
rater.request.renewal.value=Renewal
rater.request.renewal.values=QuoteType=Renewal

# MinimumTiv / MaximumTiv = the TIV band the case's TIV falls in (TIV = Coverage A + B + C + D limits, rows 18-21).
# A band includes its minimum and excludes its maximum (TIV 5,000 -> 5,000 - 10,000); above the last band -> last band.
rater.request.tiv.rows=18,19,20,21
rater.request.tiv.minimumPath=Account.Insured[0].Location[0].Building[0].MinimumTiv
rater.request.tiv.maximumPath=Account.Insured[0].Location[0].Building[0].MaximumTiv
rater.request.tiv.bands=0-5000;5000-10000;10000-20000;20000-30000;30000-40000;40000-50000;50000-60000;60000-70000;\
  70000-80000;80000-90000;90000-100000;100000-110000;110000-120000;120000-130000;130000-140000;140000-150000;\
  150000-160000;160000-170000;170000-180000;180000-190000;190000-200000;200000-10000000

# --- Wind coverage ----------------------------------------------------------------------------
# Row 43 (PLWindCoverage) = Yes: the request starts from the configuration's windTemplate - the API's wind sample request
# (config/templates/wind: HO_WIND for HO3/HO5/HO8, DP_WIND for DP1/DP3, DP_BUILDERS_RISK_WIND for DP1/DP3 Builders Risk) -
# and keeps exactly its keys: test data rows whose attribute is not in it are not sent. The wind attributes (wind.* in
# rater-request-mapping.properties) take the test data columns "Request:<Name>". A configuration without a windTemplate
# (HO6, DP1/DP3 Vacant) uses its normal template plus the wind attributes. The API then models the Gross AAL itself (TigerCQApplicable=Y) instead of
# using RMSModeledPremium (row 44), while the Rater's Gross AAL (C156) is row 44. So after the API call each wind case is
# recalculated with the API's Gross AAL (output row 156) as row 44: WindAalFactor x Gross AAL and the totals are then
# compared on the same AAL (working/rater-cases-wind.json, rater-expected-wind.json).
# Address of every case, fetched at run time from its County, State and ZIP (test data): a real street address inside that
# ZIP, State and County (checked), with its City, Latitude and Longitude - sent as LocationFullAddress, City, Latitude,
# Longitude ("address.*" in rater-request-mapping.properties). State, County and Zipcode1 stay the test data values.
# The ZIP centre is found with rater.geocode.url, then the nearest addresses around it with rater.geocode.reverseUrl
# (OpenStreetMap Nominatim). No address found: "COUNTY, ST zip, United States" at the ZIP centre (City keeps the template's).
# "Request:LocationFullAddress" in the test data is used as given; "Request:Latitude" + "Request:Longitude" skip the lookup.
# Results are cached in rater.geocode.cache, so each location is looked up once (the service allows one request a second;
# a first full run looks up the ~620 locations of the test data once).
rater.geocode.enabled=true
# false = never look an address up during a run: every case's address is in the test data (Request:LocationFullAddress,
# Request:City, Request:Latitude, Request:Longitude - real addresses confirmed with the US Census Geocoder, stored once).
# A case without them is sent with the ZIP / County only (no coordinates). true = look up missing addresses online.
rater.geocode.online=false
rater.geocode.url=https://nominatim.openstreetmap.org/search
rater.geocode.reverseUrl=https://nominatim.openstreetmap.org/reverse
# The Rater's county table (sheet County: County, State, Subline): the County sent is the case's county as spelled
# there for its State and subline (HO6 has one spelling; other sublines may list two - the test data spelling is kept
# when it is one of them). A test data county that is not in the table (e.g. a Connecticut planning region) is replaced
# by the table county of a real address in the ZIP, for the Rater and the request alike. Blank = counties are not changed.
# From config/rater-county-table.txt (exported from the County sheet of the V3.0 10/30/2026 Rater; the V4.0 Rater has
# no County sheet). rater.address.countyTable=<Sheet>!<range> reads it from the Rater instead (when countyFile is blank).
rater.address.countyFile=config/rater-county-table.txt
rater.address.countyTable=
rater.address.countyColumns=county,state,subline
rater.geocode.cache=target/rater-output/geocode-cache.json
rater.wind.row=43
rater.wind.aalInputRow=44
rater.wind.aalOutputRow=156

# --- Range-based values ---------------------------------------------------------------------
# Rows whose Rater value is an inclusive numeric range but the API needs one number inside it:
#   28 Age of Roof "0 - 5 Years" / "6 - 10 Years" / "11 or more Years"   40 Insurance Score "614-652" ... "0-548"
# Not listed on purpose: 22 Distance To Coast (bands map to the rate table's band key, see rater-value-mapping.txt),
# 31 Coverage A Band Credit (the API takes the band text itself).
rater.range.rows=28,40
# Which number of the range is sent: min | mid | max (any is valid; per row: rater.range.pick.<row>)
rater.range.pick=min

# --- Test data ------------------------------------------------------------------------------
# The single test data file: edit the cases here. It is only ever READ by a run; --generate never overwrites it.
rater.testdata.file=src/test/resources/testdata/test-data.xlsx
rater.testdata.sheet=TestData
# Which iterations (test cases) to execute. Empty = all test cases in the sheet.
# Numbers match the TestCaseId digits (1 = TC001); ranges and ids also work:  1,2,3   |   1-3,7   |   TC001,TC004
# A -DraterCases=... / --cases argument given at launch overrides this.
# Renewal flow: every subline + every state the Rater rates for it, BookOfBusinessAdjustment Yes / No
# (reports/Renewal-BOB-Iterations.csv)
rater.iterations=1,831-832,1183-1184,1638-1639,1717,1723,2123,2502,2506,2705-2706,2837-2838,3045,3047,3132-3133,3169-3170,3194-3195,3215-3216,3221-3222,3229,3793-3794,4435-4436,4792-4793,4845-4846,4860,4862,4883,4888,4899,4903,4908,4912-4913,4925-4926,4940,4942,4956,4963,4977,4999,5002,5031,5034,5040-5041,5049,5053,5068,5071,5076,5084-5085,5090,5093,5095,5098,5104,5106,5108,5110,5113,5116,5121,5149-5154,5156,5158,5165,5170-5172,5178,5189,5194,5196,5199,5202,5204,5219-5220,5239,5270,5276,5285,5300,5347,5418,5491,6915,6948,7057,7350-7951
# Number of test cases created by --generate (case 1 is always the Rater's current values)
rater.testdata.count=10
# Fixed seed => repeatable test data. Leave empty for a different set every time.
rater.testdata.seed=12345

# --- Mappings (attribute row -> JSON path) --------------------------------------------------
# Rater value -> API value translation (the test data keeps the Rater's wording; the API takes different wording for some fields)
rater.valueMapping=config/rater-value-mapping.txt
# Extra attempts when the API answers HTTP 5xx / cannot be reached (the UAT service is sometimes intermittent). 0 = no retry.
rater.api.retries=2
# API calls sent at the same time (each worker has its own connection). The calls start while the Rater is still
# calculating the next cases. 1 = one call after the other, as before. Lower it if the service answers with HTTP 5xx.
rater.api.threads=4
# On HTTP 401 (expired / invalid token) wait up to this many minutes for APIToken.txt to be updated, then send again,
# instead of failing every remaining case. 0 = do not wait.
rater.api.tokenWaitMinutes=15
rater.requestMapping=config/rater-request-mapping.properties
rater.responseMapping=config/rater-response-mapping.properties

# --- Comparison -----------------------------------------------------------------------------
# Numbers are equal when |expected - actual| <= tolerance. Override per output row with rater.compare.tolerance.<row>
rater.compare.tolerance=0.01
# rater.compare.tolerance.229=0.000001
# Rater outputs that mean "not calculated for this configuration" (e.g. TIV Factor outside HO6): reported as N/A, not compared
rater.compare.notApplicable=N/A|additive
# Resp rows the API response has no attribute for (Special Coverage A/C and Replacement Cost On Contents factors,
# Policy Term Factor): reported as N/A "Not returned by the API"
rater.compare.notInResponse=171,173,175,225
# Resp rows the API returns only when wind coverage is selected (rater.wind.row = Yes): WindAalFactor and Gross AAL.
# Without wind they are reported as N/A "Returned by the API only with wind coverage"; with wind they are compared
rater.compare.windOnly=155,156
